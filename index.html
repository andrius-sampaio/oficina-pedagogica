    function scoreToTemp(score) {
      return Math.round(Math.min(100, Math.max(0, 50 + (score || 0) * 4)));
    }

    function normalizeUrl(rawUrl) {
      if (!rawUrl) return '';
      try {
        const u = new URL(rawUrl.trim());
        u.hash = '';
        if (u.pathname.length > 1 && u.pathname.endsWith('/')) {
          u.pathname = u.pathname.slice(0, -1);
        }
        return u.toString().toLowerCase();
      } catch (e) {
        return rawUrl.trim().toLowerCase();
      }
    }

    function isValidHttpsUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === 'https:' && Boolean(url.hostname);
      } catch (_) {
        return false;
      }
    }

    function sanitize(str) {
      if (!str) return '';
      return str.replace(/[<>]/g, '').trim();
    }

    function canPerform(key, cooldownMs) {
      try {
        const raw = localStorage.getItem('rl-' + key);
        const last = raw ? parseInt(raw, 10) : 0;
        const now = Date.now();
        if (now - last < cooldownMs) return false;
        localStorage.setItem('rl-' + key, String(now));
        return true;
      } catch (e) {
        return true;
      }
    }

    function uuid() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
      return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
    }

    function getSliderColor(val) {
      const stops = [
        { p: 0,   r: 123, g: 0,   b: 234 },
        { p: 16,  r: 0,   g: 51,  b: 255 },
        { p: 32,  r: 0,   g: 200, b: 255 },
        { p: 48,  r: 0,   g: 230, b: 0   },
        { p: 64,  r: 255, g: 234, b: 0   },
        { p: 80,  r: 255, g: 122, b: 0   },
        { p: 100, r: 255, g: 0,   b: 0   }
      ];
      if (val <= stops[0].p) return '#7B00EA';
      if (val >= stops[stops.length-1].p) return '#FF0000';
      for (let i = 0; i < stops.length - 1; i++) {
        if (val >= stops[i].p && val <= stops[i+1].p) {
          const t = (val - stops[i].p) / (stops[i+1].p - stops[i].p);
          const rr = Math.round(stops[i].r + (stops[i+1].r - stops[i].r) * t);
          const gg = Math.round(stops[i].g + (stops[i+1].g - stops[i].g) * t);
          const bb = Math.round(stops[i].b + (stops[i+1].b - stops[i].b) * t);
          return '#' + [rr, gg, bb].map(x => x.toString(16).padStart(2, '0')).join('');
        }
      }
      return '#FF0000';
    }

    function InfoTooltip({ text }) {
      const [isOpen, setIsOpen] = useState(false);
      const containerRef = useRef(null);

      useEffect(() => {
        if (!isOpen) return;

        function handleClickOutside(event) {
          if (containerRef.current && !containerRef.current.contains(event.target)) {
            setIsOpen(false);
          }
        }

        function handleKeyDown(event) {
          if (event.key === 'Escape') setIsOpen(false);
        }

        document.addEventListener('mousedown', handleClickOutside);
        document.addEventListener('touchstart', handleClickOutside);
        document.addEventListener('keydown', handleKeyDown);

        return () => {
          document.removeEventListener('mousedown', handleClickOutside);
          document.removeEventListener('touchstart', handleClickOutside);
          document.removeEventListener('keydown', handleKeyDown);
        };
      }, [isOpen]);

      return (
        <div className="relative inline-flex items-center" ref={containerRef}>
          <button
            type="button"
            onClick={(e) => {
              e.preventDefault();
              e.stopPropagation();
              setIsOpen((prev) => !prev);
            }}
            onMouseEnter={() => setIsOpen(true)}
            onMouseLeave={() => setIsOpen(false)}
            aria-label="Informações sobre a temperatura"
            aria-expanded={isOpen}

              <span className="absolute left-1/2 top-full -translate-x-1/2 border-4 border-transparent border-t-slate-900"></span>
            </div>
          )}
        </div>
      );
    }

    function ToastContainer({ toasts, onCloseToast }) {
      if (!toasts.length) return null;
      return (

                  : toast.type === 'success'

                  : 'bg-slate-900 border-slate-800 text-white'
              }`}

    }

    function Thermometer({ resource, userVote, onVote }) {
      const initialVal = userVote !== undefined ? userVote : 50;
      const [val, setVal] = useState(initialVal);
      const debounceRef = useRef(null);

      useEffect(() => {
        if (userVote !== undefined) {
          setVal(userVote);
        }
      }, [userVote]);

      const color = getSliderColor(val);
      const communityTemp = scoreToTemp(resource.score);

      const commitVote = useCallback((targetValue) => {
        onVote(resource.id, targetValue);
      }, [onVote, resource.id]);

      function handleChange(e) {
        const newVal = parseInt(e.target.value, 10);
        setVal(newVal);
        if (debounceRef.current) clearTimeout(debounceRef.current);
        debounceRef.current = setTimeout(() => {
          commitVote(newVal);
        }, 350);
      }

      function handleCommit() {
        if (debounceRef.current) clearTimeout(debounceRef.current);
        commitVote(val);
      }

      return (
        <div className="rounded-xl border border-slate-200/80 bg-slate-50/80 p-3">
          <div className="mb-2 flex items-center justify-between">
            <div className="flex items-center gap-1.5">

              <InfoTooltip text="Avalie de 0° (frio/pouco útil) a 100° (fervendo/excelente) para ajudar outros professores." />
            </div>
            <span 
              className="text-sm font-extrabold tabular-nums px-1.5 py-0.5 rounded bg-white border shadow-xs" 
              style={{ color }}
            >
              {val}°
            </span>
          </div>

          <input
            type="range"
            min="0"
            max="100"
            step="1"
            value={val}

    function SubmitModal({ open, onClose, onSubmit, categories, isDuplicateUrl }) {
      const [form, setForm] = useState({ title: '', url: '', category: '', tags: '', description: '' });
      const [errors, setErrors] = useState({});
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (!open) {
          setForm({ title: '', url: '', category: '', tags: '', description: '' });
          setErrors({});
          setSubmitting(false);
        }
      }, [open]);

      function validate() {
        const e = {};
        const title = sanitize(form.title);
        const description = sanitize(form.description);
        const url = form.url.trim();

        if (title.length < 3 || title.length > 80) {
          e.title = 'O título deve ter entre 3 e 80 carateres.';
        }

        if (!isValidHttpsUrl(url)) {
          e.url = 'Insira um URL seguro e válido (começado obrigatoriamente por https://).';
        } else if (isDuplicateUrl(url)) {
          e.url = 'Este recurso/link já se encontra registado no repositório.';
        }

        if (!form.category) {
          e.category = 'Selecione uma categoria correspondente.';
        }

        if (description.length < 10 || description.length > 150) {
          e.description = 'A descrição deve ter entre 10 e 150 carateres.';
        }

        setErrors(e);
        return Object.keys(e).length === 0;
      }

      async function handleSubmit(ev) {
        ev.preventDefault();
        if (!validate()) return;

        if (!canPerform('submit', 8000)) {
          setErrors({ global: 'Por favor, aguarde alguns segundos antes de submeter outro recurso.' });
          return;
        }

        setSubmitting(true);
        const norm = normalizeUrl(form.url);

        const tagsArray = sanitize(form.tags)
          .split(',')
          .map((s) => s.trim().toLowerCase().replace(/^#/, ''))
          .filter((s) => s.length > 1)
          .slice(0, 5);

        const payload = {
          title: sanitize(form.title),
          url: form.url.trim(),
          normalized_url: norm,
          category: form.category,
          description: sanitize(form.description),
          tags: tagsArray,
          score: 0,
          created_at: new Date().toISOString(),
        };

        await onSubmit(payload);
        setSubmitting(false);
        onClose();
      }

      if (!open) return null;

      return (
        <div 
          className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/60 p-4 backdrop-blur-xs"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-title"
        >
          <div className="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-6 shadow-2xl">
            <div className="mb-4 flex items-center justify-between border-b border-slate-100 pb-3">

                <p className="text-xs text-slate-500">Partilhe uma ferramenta aberta com a comunidade docente.</p>
              </div>
              <button
                onClick={onClose}
                className="rounded-xl p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition"
                aria-label="Fechar janela modal"
              >
                <IcoX cls="h-5 w-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="flex flex-col gap-4">
              {errors.global && (
                <div className="rounded-xl bg-red-50 p-3 text-xs font-semibold text-red-700 border border-red-200">
                  {errors.global}
                </div>
              )}

              <div>
                <label className="mb-1 block text-xs font-semibold text-slate-700">Título do Recurso *</label>
                <input
                  type="text"
                  value={form.title}
                  onChange={(e) => setForm((s) => ({ ...s, title: e.target.value }))}
                  className={`h-10 w-full rounded-xl border bg-slate-50/60 px-3.5 text-sm outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/20 ${
                    errors.title ? 'border-red-500' : 'border-slate-200'

                  placeholder="Ex: GeoGebra, PhET, Scratch..."
                />
                {errors.title && <span className="mt-1 block text-xs font-medium text-red-600">{errors.title}</span>}
              </div>

              <div>
                <label className="mb-1 block text-xs font-semibold text-slate-700">URL Seguro (HTTPS) *</label>
                <input

    function App() {
      const [resources, setResources] = useState(() => {
        try {
          const saved = localStorage.getItem('edu-resources-v2');
          return saved ? JSON.parse(saved) : SEED_RESOURCES;
        } catch (e) {
          return SEED_RESOURCES;
        }
      });

      const [userVotes, setUserVotes] = useState(() => {
        try {
          const saved = localStorage.getItem('edu-votes-v2');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [reports, setReports] = useState(() => {
        try {
          const saved = localStorage.getItem('edu-reports-v2');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [debouncedQuery, setDebouncedQuery] = useState('');
      const [activeCategory, setActiveCategory] = useState(null);
      const [activeTag, setActiveTag] = useState(null);
      const [sortKey, setSortKey] = useState('hot');
      const [visibleCount, setVisibleCount] = useState(12);
      const [modalOpen, setModalOpen] = useState(false);
      const [reportModalData, setReportModalData] = useState(null);
      const [toasts, setToasts] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);

      const clientToken = useMemo(() => getOrCreateClientToken(), []);

      const showToast = useCallback((message, type = 'info') => {
        const id = uuid();
        setToasts((prev) => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((t) => t.id !== id));
        }, 4000);
      }, []);

      const closeToast = useCallback((id) => {
        setToasts((prev) => prev.filter((t) => t.id !== id));
      }, []);

      const fetchSupabaseData = useCallback(async () => {
        if (!supabaseClient) return;
        setIsSyncing(true);
        try {
          const { data, error } = await supabaseClient
            .from('resources')
            .select('*')
            .eq('is_hidden', false)
            .order('created_at', { ascending: false });

          if (error) {
            console.warn('Erro ao carregar dados do Supabase:', error.message);
          } else if (data && data.length > 0) {
            setResources(data);
          } else if (data && data.length === 0) {
            // Se a tabela estiver vazia, sincroniza a semente inicial no banco
            for (const item of SEED_RESOURCES) {
              await supabaseClient.from('resources').upsert({
                title: item.title,
                url: item.url,
                normalized_url: item.normalized_url,
                category: item.category,
                description: item.description,
                tags: item.tags,
                score: item.score
              }, { onConflict: 'normalized_url' });
            }
          }

          // Carrega os votos já feitos por este cliente
          const { data: voteData } = await supabaseClient
            .rpc('get_my_votes', { p_client_token: clientToken });

          if (voteData && voteData.length > 0) {
            const voteMap = {};
            voteData.forEach((v) => { voteMap[v.resource_id] = v.vote_val; });
            setUserVotes((prev) => ({ ...prev, ...voteMap }));
          }
        } catch (err) {
          console.error('Falha na sincronização remota:', err);
        } finally {
          setIsSyncing(false);
        }
      }, [clientToken]);

      useEffect(() => {
        if (isSupabaseConfigured) {
          fetchSupabaseData();
        }
      }, [fetchSupabaseData]);

      // Backup local sempre ativo
      useEffect(() => {
        try {
          localStorage.setItem('edu-resources-v2', JSON.stringify(resources));
        } catch (e) {}
      }, [resources]);

      useEffect(() => {
        try {
          localStorage.setItem('edu-votes-v2', JSON.stringify(userVotes));
        } catch (e) {}
      }, [userVotes]);

      useEffect(() => {
        try {
          localStorage.setItem('edu-reports-v2', JSON.stringify(reports));
        } catch (e) {}
      }, [reports]);

      useEffect(() => {
        const timer = setTimeout(() => setDebouncedQuery(searchQuery), 250);
        return () => clearTimeout(timer);
      }, [searchQuery]);

      useEffect(() => {
        setVisibleCount(12);
      }, [debouncedQuery, activeCategory, activeTag, sortKey]);

      const allTags = useMemo(() => {
        const tagSet = new Set();
        resources.forEach((r) => {
          if (Array.isArray(r.tags)) {
            r.tags.forEach((t) => tagSet.add(t));
          }
        });
        return Array.from(tagSet).sort();
      }, [resources]);

      const isDuplicateUrl = useCallback((rawUrl) => {
        const norm = normalizeUrl(rawUrl);
        return resources.some((r) => r.normalized_url === norm);
      }, [resources]);

      const filtered = useMemo(() => {
        const q = debouncedQuery ? debouncedQuery.toLowerCase().trim() : '';

        const list = resources.filter((r) => {
          if ((reports[r.id] || 0) >= 4) return false;
          if (activeCategory && r.category !== activeCategory) return false;
          if (activeTag && (!r.tags || !r.tags.includes(activeTag))) return false;

          if (q) {
            const tagsText = (r.tags || []).join(' ');
            const searchable = `${r.title} ${r.description} ${tagsText}`.toLowerCase();
            if (!searchable.includes(q)) return false;
          }
          return true;
        });

        return list.sort((a, b) => {
          if (sortKey === 'hot') {
            return (b.score - a.score) || b.created_at.localeCompare(a.created_at);
          }
          if (sortKey === 'recent') {
            return b.created_at.localeCompare(a.created_at);
          }
          return a.title.localeCompare(b.title, 'pt', { sensitivity: 'base' });
        });
      }, [resources, reports, debouncedQuery, activeCategory, activeTag, sortKey]);

      const visibleResources = useMemo(() => {
        return filtered.slice(0, visibleCount);
      }, [filtered, visibleCount]);

      const handleVote = useCallback(async (resourceId, targetVal) => {
        const previousVal = userVotes[resourceId] !== undefined ? userVotes[resourceId] : 50;
        if (previousVal === targetVal) return;

        const prevDelta = (previousVal - 50) / 4;
        const newDelta = (targetVal - 50) / 4;
        const diff = Math.round(newDelta - prevDelta);

        // Otimistic update no React
        setResources((prev) =>
          prev.map((item) =>
            item.id === resourceId ? { ...item, score: (item.score || 0) + diff } : item
          )
        );
        setUserVotes((prev) => ({ ...prev, [resourceId]: targetVal }));

        // Grava no Supabase se conectado
        if (supabaseClient) {
          try {
            await supabaseClient.rpc('cast_vote', {
              p_resource_id: resourceId,
              p_client_token: clientToken,
              p_vote_val: targetVal
            });
          } catch (e) {
            console.error('Erro ao gravar voto remoto:', e);
          }
        }
      }, [userVotes, clientToken]);

      function triggerReportModal(id, title) {
        setReportModalData({ id, title });
      }

      async function confirmReport() {
        if (!reportModalData) return;
        const resourceId = reportModalData.id;

        if (!canPerform('report-' + resourceId, 5000)) {
          showToast('Já reportou este item recentemente.', 'error');
          setReportModalData(null);
          return;
        }

        setReports((prev) => {
          const count = (prev[resourceId] || 0) + 1;
          return { ...prev, [resourceId]: count };
        });

        if (supabaseClient) {
          try {
            await supabaseClient.rpc('report_resource', {
              p_resource_id: resourceId,
              p_client_token: clientToken
            });
          } catch (e) {
            console.error('Erro ao reportar no Supabase:', e);
          }
        }

        showToast('Denúncia registada. Obrigado pela colaboração!', 'success');
        setReportModalData(null);
      }

      async function handleAddResource(newResource) {
        const item = { ...newResource, id: uuid() };
        
        // Se o Supabase estiver conectado, insere na nuvem via RPC com rate limit
        if (supabaseClient) {
          try {
            const { data, error } = await supabaseClient.rpc('submit_resource', {
              p_title: item.title,
              p_url: item.url,
              p_normalized_url: item.normalized_url,
              p_category: item.category,
              p_description: item.description,
              p_tags: item.tags,
              p_client_token: clientToken
            });

            if (error) {
              if (error.message === 'Rate limit exceeded') {
                showToast('Aguarde alguns segundos antes de submeter outro recurso.', 'error');
              } else {
                showToast('Erro ao gravar no banco de dados: ' + error.message, 'error');
              }
              return;
            }
            if (data) {
              setResources((prev) => [data, ...prev]);
              showToast('Recurso publicado e salvo na nuvem com sucesso!', 'success');
              return;
            }
          } catch (e) {
            console.error('Falha ao submeter remoto:', e);
          }
        }

        // Modo offline / fallback
        setResources((prev) => [item, ...prev]);
        showToast('Recurso publicado com sucesso!', 'success');
      }

      function handleResetData() {
        setResources(SEED_RESOURCES);
        setUserVotes({});
        setReports({});
        try {
          localStorage.removeItem('edu-resources-v2');
          localStorage.removeItem('edu-votes-v2');
          localStorage.removeItem('edu-reports-v2');
        } catch (_) {}
        showToast('Catálogo padrão restaurado com sucesso!', 'info');
      }

      return (
        <div className="min-h-screen flex flex-col bg-gradient-to-br from-slate-100 via-slate-50 to-blue-50/50 text-slate-900">
          <ToastContainer toasts={toasts} onCloseToast={closeToast} />

          {/* Cabeçalho */}
          <header className="bg-slate-900 text-white shadow-md">
            <div className="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6">
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="text-lg font-bold tracking-tight">Oficina Pedagógica</h1>
                  
                  {/* Status da Conexão Supabase */}
                  {isSupabaseConfigured ? (
                    <span className="inline-flex items-center gap-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">
                      <span className="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                      Nuvem Ativa
                    </span>
                  ) : (
                    <span className="inline-flex items-center gap-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-medium px-2 py-0.5 rounded-full" title="Para ativar a sincronização na nuvem, cole a sua Chave Anon no código.">
                      Modo Local
                    </span>
                  )}
                </div>
                <p className="text-[11px] text-slate-400 font-medium">Repositório Colaborativo de Recursos Educativos</p>
              </div>

              <button
                onClick={() => setModalOpen(true)}
                className="hidden sm:inline-flex items-center gap-2 rounded-xl bg-blue-600 px-4 py-2 text-xs font-semibold text-white shadow-sm transition hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-400"
              >
                <IcoPlus cls="h-4 w-4" />
                <span>Indicar Recurso</span>
              </button>
            </div>
          </header>

          {/* Barra de Procura e Filtros */}
          <TopBar
            query={searchQuery}
            onQueryChange={setSearchQuery}
            sortKey={sortKey}
            onSortChange={setSortKey}
            allTags={allTags}
            activeTag={activeTag}
            onTagChange={setActiveTag}
          />

          <main className="mx-auto max-w-7xl w-full flex-1 px-4 py-5 sm:px-6">
            <FilterPills active={activeCategory} onChange={setActiveCategory} />

            {activeTag && (
              <div className="mt-3 flex items-center gap-2">
                <span className="text-xs font-medium text-slate-500">A filtrar pela tag:</span>
                <span className="inline-flex items-center gap-1.5 rounded-full bg-blue-100/70 border border-blue-200 px-3 py-1 text-xs font-semibold text-blue-800">
                  #{activeTag}
                  <button
                    onClick={() => setActiveTag(null)}
                    className="rounded-full p-0.5 hover:bg-blue-200 text-blue-700 transition"
                    aria-label="Remover filtro de tag"
                  >
                    <IcoX cls="h-3 w-3" />
                  </button>
                </span>
              </div>
            )}

            <div className="my-4 flex items-center justify-between text-xs font-medium text-slate-500">
              <span>{filtered.length} recurso{filtered.length !== 1 ? 's' : ''} encontrado{filtered.length !== 1 ? 's' : ''}</span>
              {filtered.length > 0 && (
                <span>A apresentar {Math.min(visibleCount, filtered.length)} de {filtered.length}</span>
              )}
            </div>

            {visibleResources.length === 0 ? (
              <div className="my-16 flex flex-col items-center justify-center gap-3 rounded-2xl border border-dashed border-slate-300 bg-white/50 p-12 text-center text-slate-500">
                <IcoSearchX cls="h-10 w-10 text-slate-400" />
                <h3 className="text-base font-bold text-slate-800">Nenhum recurso encontrado</h3>
                <p className="max-w-md text-xs leading-relaxed text-slate-500">
                  Não foram encontradas ferramentas com os critérios de pesquisa ou tags selecionadas. Experimente redefinir os filtros ou sugerir um novo recurso.
                </p>
                <button
                  onClick={() => { setSearchQuery(''); setActiveCategory(null); setActiveTag(null); }}
                  className="mt-2 rounded-xl bg-slate-100 px-4 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-200 transition"
                >
                  Limpar todos os filtros
                </button>
              </div>
            ) : (
              <>
                <div className="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                  {visibleResources.map((resource) => (
                    <ResourceCard
                      key={resource.id}
                      resource={resource}
                      userVote={userVotes[resource.id]}
                      onVote={handleVote}
                      onTagClick={setActiveTag}
                      onReport={triggerReportModal}
                    />
                  ))}
                </div>

                {visibleCount < filtered.length && (
                  <div className="mt-10 flex justify-center pb-6">
                    <button
                      onClick={() => setVisibleCount((prev) => prev + 12)}
                      className="rounded-xl border border-slate-200 bg-white px-7 py-3 text-xs font-bold text-slate-700 shadow-sm transition hover:bg-slate-50 hover:border-slate-300 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-400"
                    >
                      Carregar mais recursos ({filtered.length - visibleCount} restantes)
                    </button>
                  </div>
                )}
              </>
            )}
          </main>

          {/* Botão Flutuante (FAB) para Mobile */}
          <button
            onClick={() => setModalOpen(true)}
            className="fixed bottom-6 right-6 z-40 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-xl transition-transform duration-200 hover:bg-blue-500 hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-blue-400/40 sm:hidden"
            aria-label="Sugerir novo recurso educativo"
          >
            <IcoPlus cls="h-6 w-6" />
          </button>

          {/* Modais */}
          <SubmitModal
            open={modalOpen}
            onClose={() => setModalOpen(false)}
            onSubmit={handleAddResource}
            categories={CATEGORIES}
            isDuplicateUrl={isDuplicateUrl}
          />

          <ReportConfirmModal
            open={Boolean(reportModalData)}
            targetResource={reportModalData}
            onClose={() => setReportModalData(null)}
            onConfirm={confirmReport}
          />

          {/* Rodapé */}
          <footer className="border-t border-slate-200 bg-white py-8 text-center text-xs text-slate-500 mt-auto">
            <div className="mx-auto max-w-7xl px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="text-left">
                <p className="font-semibold text-slate-700">Oficina Pedagógica &copy; 2026</p>
                <p className="mt-0.5">
                  Idealizado por Andrius Sampaio &bull;{' '}
                  <a href="mailto:andrius.sampa@gmail.com" className="text-blue-600 hover:underline">
                    andrius.sampa@gmail.com
                  </a>
                </p>
              </div>

              <div>
                <button
                  onClick={handleResetData}
                  className="rounded-lg px-3 py-1.5 text-[11px] font-medium text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition"
                  title="Restaurar lista original de recursos"
                >
                  Restaurar dados padrão
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
